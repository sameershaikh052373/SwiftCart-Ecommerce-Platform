<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiftcart - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style th:replace="fragments/styles :: common-styles"></style>
    <style>

        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .login-card {
            background-color: #e9ecef;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
        }

        .login-title {
            color: #6c5ce7;
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            padding-bottom: 10px;
        }

        .login-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: #6c5ce7;
            border-radius: 3px;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px 15px;
            margin-bottom: 1.5rem;
        }

        .form-control:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 0.25rem rgba(108, 92, 231, 0.25);
        }

        .btn-login {
            background-color: #6c5ce7;
            border: none;
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #5649c0;
            transform: translateY(-2px);
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #636e72;
        }

        .register-link a {
            color: #6c5ce7;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

<nav th:replace="fragments/navbar :: auth-navbar"></nav>

<!-- Login Form -->
<div class="login-container">
    <div class="login-card">
        <h2 class="login-title">
            <i class="fas fa-sign-in-alt me-2"></i>User Login
        </h2>

        <!-- ✅ Thymeleaf-enabled Login Form -->
        <form th:action="@{/getlogin}" method="post" id="loginForm" novalidate>
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" class="form-control" id="username"
                       placeholder="Enter your username" required>
                <div class="invalid-feedback" id="usernameError"></div>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" class="form-control" id="password"
                       placeholder="Enter your password" required>
                <div class="invalid-feedback" id="passwordError"></div>
            </div>
            <button type="submit" class="btn btn-login mt-3">
                <i class="fas fa-lock me-2"></i>Login
            </button>
            <div class="register-link">
                Don't have an account? <a href="/registration">Register here</a>
            </div>
            <div class="text-center mt-3">
                <a href="/forgot-password" class="text-decoration-none" style="color: #6c5ce7; font-size: 0.9rem;">
                    <i class="fas fa-key me-1"></i>Forgot Password?
                </a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
<script th:replace="fragments/footer :: footer-script"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Form validation
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        let isValid = true;
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        
        // Reset previous errors
        username.classList.remove('is-invalid');
        password.classList.remove('is-invalid');
        document.getElementById('usernameError').textContent = '';
        document.getElementById('passwordError').textContent = '';
        
        // Validate username
        if (!username.value.trim()) {
            username.classList.add('is-invalid');
            document.getElementById('usernameError').textContent = 'Username is required';
            isValid = false;
        } else if (username.value.trim().length < 3) {
            username.classList.add('is-invalid');
            document.getElementById('usernameError').textContent = 'Username must be at least 3 characters';
            isValid = false;
        }
        
        // Validate password
        if (!password.value) {
            password.classList.add('is-invalid');
            document.getElementById('passwordError').textContent = 'Password is required';
            isValid = false;
        } else if (password.value.length < 6) {
            password.classList.add('is-invalid');
            document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
            isValid = false;
        }
        
        if (!isValid) {
            e.preventDefault();
        }
    });
    
    // Real-time validation
    document.getElementById('username').addEventListener('blur', function() {
        if (!this.value.trim()) {
            this.classList.add('is-invalid');
            document.getElementById('usernameError').textContent = 'Username is required';
        } else if (this.value.trim().length < 3) {
            this.classList.add('is-invalid');
            document.getElementById('usernameError').textContent = 'Username must be at least 3 characters';
        } else {
            this.classList.remove('is-invalid');
            document.getElementById('usernameError').textContent = '';
        }
    });
    
    document.getElementById('password').addEventListener('blur', function() {
        if (!this.value) {
            this.classList.add('is-invalid');
            document.getElementById('passwordError').textContent = 'Password is required';
        } else if (this.value.length < 6) {
            this.classList.add('is-invalid');
            document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
        } else {
            this.classList.remove('is-invalid');
            document.getElementById('passwordError').textContent = '';
        }
    });
</script>
</body>
</html>
