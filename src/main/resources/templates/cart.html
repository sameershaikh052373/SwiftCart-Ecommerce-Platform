<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Swiftcart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style th:replace="fragments/styles :: common-styles"></style>
    <style>

        /* Main Content */
        .container {
            flex: 1;
            padding: 2rem 1rem;
        }

        .cart-container {
            background-color: #e9ecef;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .section-title {
            color: #6c5ce7;
            margin-bottom: 1.5rem;
            position: relative;
            padding-bottom: 10px;
            text-align: center;
        }

        .section-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: #6c5ce7;
            border-radius: 3px;
        }

        /* Cart Table */
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        .cart-table th {
            background-color: #f1f1f1;
            padding: 12px;
            text-align: left;
        }

        .cart-table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .cart-table tr:hover {
            background-color: #f8f9fa;
        }

        /* Buttons */
        .btn-primary {
            background-color: #6c5ce7;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #5649c0;
            transform: translateY(-2px);
        }

        .btn-success {
            background-color: #6c5ce7;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .btn-success:hover {
            background-color: #d6306f;
            transform: translateY(-2px);
        }

        /* Form Elements */
        .checkout-form {
            margin-top: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #6c5ce7;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #6c5ce7;
            outline: none;
            box-shadow: 0 0 0 2px rgba(108, 92, 231, 0.2);
        }

        /* Footer */
        footer {
            background-color: #343a40;
            color: white;
            padding: 30px 0;
            margin-top: 50px;
            border-radius: 12px 12px 0 0;
        }

        .social-links a {
            color: white;
            font-size: 1.2rem;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            color: #a29bfe;
            transform: translateY(-3px);
        }

        .copyright {
            color: #b2b2b2;
            font-size: 0.9rem;
        }

        /* Action Links */
        .action-links {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .action-link {
            color: #6c5ce7;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #6c5ce7;
            transition: all 0.3s ease;
        }

        .action-link:hover {
            background-color: #6c5ce7;
            color: white;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .navbar-collapse {
                background: white;
                border-radius: 0 0 12px 12px;
                padding: 15px;
                margin-top: 10px;
            }
            
            .navbar-collapse .nav-link {
                padding: 8px 0;
                margin: 5px 0;
                background-color: transparent !important;
            }
            
            .navbar-collapse .nav-link:hover,
            .navbar-collapse .nav-link.active {
                color: #6c5ce7 !important;
                background-color: transparent !important;
                text-decoration: underline;
                text-underline-offset: 5px;
            }
            
            .cart-container {
                padding: 1.5rem;
            }
            
            .cart-table th, 
            .cart-table td {
                padding: 8px 6px;
                font-size: 0.9rem;
            }
            
            .btn-primary, .btn-success {
                width: 100%;
                margin-bottom: 10px;
            }
            
            .action-links {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .action-link {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .cart-table th, 
            .cart-table td {
                padding: 6px 4px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
<nav th:replace="fragments/navbar :: user-navbar"></nav>

<!-- ✅ Main Content -->
<div class="container">
    <div class="cart-container">
        <h2 class="section-title"><i class="fas fa-shopping-cart me-2"></i> Your Cart</h2>

        <div th:if="${session.cartError}" class="alert alert-danger text-center">
            <p th:text="${session.cartError}"></p>
        </div>

        <div class="table-responsive">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(cartProducts)}">
                        <td colspan="5" class="text-center text-muted">Your cart is empty.</td>
                    </tr>
                    <tr th:each="item : ${cartProducts}" th:id="'row-' + ${item.product.id}">
                        <td th:text="${item.product.name}">Product Name</td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(item.product.price, 1, 2)}">0.00</td>
                        <td>
                            <button class="btn btn-sm btn-outline-secondary qty-btn" data-action="decrease" th:data-product-id="${item.product.id}">-</button>
                            <span th:text="${item.quantity}" th:id="'qty-' + ${item.product.id}"></span>
                            <button class="btn btn-sm btn-outline-secondary qty-btn" data-action="increase" th:data-product-id="${item.product.id}">+</button>
                        </td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(item.totalPrice, 1, 2)}" th:id="'subtotal-' + ${item.product.id}">0.00</td>
                        <td>
                            <a th:href="@{'/cart/remove/' + ${item.product.id}}" class="text-danger">
                                <i class="fas fa-trash-alt"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <h4 class="text-end">
            Total: ₹<span class="text-primary" id="cartTotal" th:text="${total}">0.00</span>
        </h4>

        <div class="text-center mt-4">
            <form th:action="@{/cart/clear}" method="post">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-trash-alt me-2"></i>Clear Cart
                </button>
            </form>
        </div>
        <div class="text-center mt-3">
    <a href="/address" class="btn btn-primary">
        <i class="fas fa-credit-card me-2"></i>Proceed to Checkout
    </a>
</div>
    </div>

        <h2 class="section-title"><i class="fas fa-credit-card me-2"></i> Checkout</h2>

    <div class="action-links">
        <a href="/" class="action-link"><i class="fas fa-arrow-left me-2"></i>Continue Shopping</a>
    </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
<script th:replace="fragments/footer :: footer-script"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>

    $(document).ready(function () {
        $(".qty-btn").click(function () {
            const productId = $(this).data("product-id");
            const action = $(this).data("action");

            $.post("/cart/update-ajax", { productId: productId, action: action }, function (response) {
                if (response.success) {
                    $("#qty-" + productId).text(response.quantity);
                    $("#subtotal-" + productId).text("₹" + response.subtotal.toFixed(2));
                    $("#cartTotal").text(response.total.toFixed(2));
                } else {
                    alert(response.error || "Something went wrong.");
                }
            });
        });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
