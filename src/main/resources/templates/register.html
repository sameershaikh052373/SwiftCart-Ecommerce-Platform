<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiftcart - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style th:replace="fragments/styles :: common-styles"></style>
    <style>

        /* Main Content */
        .register-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .register-card {
            background-color: #e9ecef;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
        }

        .register-title {
            color: #6c5ce7;
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            padding-bottom: 10px;
        }

        .register-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: #6c5ce7;
            border-radius: 3px;
        }

        /* Form Styles */
        .form-control {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px 15px;
            margin-bottom: 1.5rem;
        }

        .form-control:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 0.25rem rgba(108, 92, 231, 0.25);
        }

        .btn-register {
            background-color: #6c5ce7;
            border: none;
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            background-color: #5649c0;
            transform: translateY(-2px);
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #636e72;
        }

        .login-link a {
            color: #6c5ce7;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Error Messages */
        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: -1rem;
            margin-bottom: 1rem;
        }

        /* Footer - Same as login */
        footer {
            background-color: #343a40;
            color: white;
            padding: 30px 0;
            margin-top: 50px;
            border-radius: 12px 12px 0 0;
        }

        .social-links a {
            color: white;
            font-size: 1.2rem;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            color: #a29bfe;
            transform: translateY(-3px);
        }

        .copyright {
            color: #b2b2b2;
            font-size: 0.9rem;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .navbar-collapse {
                background: white;
                border-radius: 0 0 12px 12px;
                padding: 15px;
                margin-top: 10px;
            }
            
            .register-card {
                padding: 1.5rem;
            }
            
            /* Mobile-specific nav link hover styles */
            .navbar-collapse .nav-link {
                padding: 8px 0;
                margin: 5px 0;
                background-color: transparent !important;
            }
            
            .navbar-collapse .nav-link:hover,
            .navbar-collapse .nav-link.active {
                color: #6c5ce7 !important;
                background-color: transparent !important;
                text-decoration: underline;
                text-underline-offset: 5px;
            }
        }
    </style>
</head>
<body>
    <nav th:replace="fragments/navbar :: auth-navbar"></nav>

    <!-- Registration Form -->
    <div class="register-container">
        <div class="register-card">
            <h2 class="register-title">
                <i class="fas fa-user-plus me-2"></i>Create Account
            </h2>
            <form th:action="@{/registeruser}" th:object="${user}" method="post" id="registerForm" novalidate>
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" th:field="*{username}" 
                           class="form-control" 
                           placeholder="Enter your username" required>
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-message"></div>
                    <div th:if="${usernameExists}" class="error-message">Username is already taken. Please choose another.</div>
                    <div class="invalid-feedback" id="usernameError"></div>
                </div>

                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" th:field="*{password}" 
                           class="form-control" 
                           placeholder="Enter your password" required>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></div>
                    <div class="invalid-feedback" id="passwordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" 
                           class="form-control" 
                           placeholder="Confirm your password" required>
                    <div class="invalid-feedback" id="confirmPasswordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" th:field="*{email}" 
                           class="form-control" 
                           placeholder="Enter your email" required>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></div>
                    <div class="invalid-feedback" id="emailError"></div>
                </div>
                
                <div class="form-group">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" id="phone" th:field="*{phone}" 
                           class="form-control" 
                           placeholder="Enter your phone number">
                    <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error-message"></div>
                    <div class="invalid-feedback" id="phoneError"></div>
                </div>
                
                <button type="submit" class="btn btn-register mt-3">
                    <i class="fas fa-user-edit me-2"></i>Register
                </button>
                
                <div class="login-link">
                    Already have an account? <a href="/login">Login here</a>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="fragments/footer :: footer"></footer>
    <script th:replace="fragments/footer :: footer-script"></script>

    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form validation
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            let isValid = true;
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const email = document.getElementById('email');
            const phone = document.getElementById('phone');
            
            // Reset previous errors
            [username, password, confirmPassword, email, phone].forEach(field => {
                field.classList.remove('is-invalid');
                document.getElementById(field.id + 'Error').textContent = '';
            });
            
            // Validate username
            if (!username.value.trim()) {
                username.classList.add('is-invalid');
                document.getElementById('usernameError').textContent = 'Username is required';
                isValid = false;
            } else if (username.value.trim().length < 3) {
                username.classList.add('is-invalid');
                document.getElementById('usernameError').textContent = 'Username must be at least 3 characters';
                isValid = false;
            }
            
            // Validate password
            if (!password.value) {
                password.classList.add('is-invalid');
                document.getElementById('passwordError').textContent = 'Password is required';
                isValid = false;
            } else if (password.value.length < 6) {
                password.classList.add('is-invalid');
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
                isValid = false;
            }
            
            // Validate confirm password
            if (!confirmPassword.value) {
                confirmPassword.classList.add('is-invalid');
                document.getElementById('confirmPasswordError').textContent = 'Please confirm your password';
                isValid = false;
            } else if (password.value !== confirmPassword.value) {
                confirmPassword.classList.add('is-invalid');
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
                isValid = false;
            }
            
            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email.value.trim()) {
                email.classList.add('is-invalid');
                document.getElementById('emailError').textContent = 'Email is required';
                isValid = false;
            } else if (!emailRegex.test(email.value.trim())) {
                email.classList.add('is-invalid');
                document.getElementById('emailError').textContent = 'Please enter a valid email address';
                isValid = false;
            }
            
            // Validate phone (optional but if provided, must be valid)
            if (phone.value.trim()) {
                const phoneRegex = /^[\+]?[1-9][\d]{0,15}$/;
                if (!phoneRegex.test(phone.value.trim())) {
                    phone.classList.add('is-invalid');
                    document.getElementById('phoneError').textContent = 'Please enter a valid phone number';
                    isValid = false;
                }
            }
            
            if (!isValid) {
                e.preventDefault();
            }
        });
        
        // Real-time validation
        const fields = ['username', 'password', 'confirmPassword', 'email', 'phone'];
        fields.forEach(fieldId => {
            const field = document.getElementById(fieldId);
            if (field) {
                field.addEventListener('blur', function() {
                    validateField(fieldId);
                });
            }
        });
        
        function validateField(fieldId) {
            const field = document.getElementById(fieldId);
            const errorElement = document.getElementById(fieldId + 'Error');
            
            switch(fieldId) {
                case 'username':
                    if (!field.value.trim()) {
                        field.classList.add('is-invalid');
                        errorElement.textContent = 'Username is required';
                    } else if (field.value.trim().length < 3) {
                        field.classList.add('is-invalid');
                        errorElement.textContent = 'Username must be at least 3 characters';
                    } else {
                        field.classList.remove('is-invalid');
                        errorElement.textContent = '';
                    }
                    break;
                    
                case 'password':
                    if (!field.value) {
                        field.classList.add('is-invalid');
                        errorElement.textContent = 'Password is required';
                    } else if (field.value.length < 6) {
                        field.classList.add('is-invalid');
                        errorElement.textContent = 'Password must be at least 6 characters';
                    } else {
                        field.classList.remove('is-invalid');
                        errorElement.textContent = '';
                    }
                    break;
                    
                case 'confirmPassword':
                    const password = document.getElementById('password');
                    if (!field.value) {
                        field.classList.add('is-invalid');
                        errorElement.textContent = 'Please confirm your password';
                    } else if (password.value !== field.value) {
                        field.classList.add('is-invalid');
                        errorElement.textContent = 'Passwords do not match';
                    } else {
                        field.classList.remove('is-invalid');
                        errorElement.textContent = '';
                    }
                    break;
                    
                case 'email':
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!field.value.trim()) {
                        field.classList.add('is-invalid');
                        errorElement.textContent = 'Email is required';
                    } else if (!emailRegex.test(field.value.trim())) {
                        field.classList.add('is-invalid');
                        errorElement.textContent = 'Please enter a valid email address';
                    } else {
                        field.classList.remove('is-invalid');
                        errorElement.textContent = '';
                    }
                    break;
                    
                case 'phone':
                    if (field.value.trim()) {
                        const phoneRegex = /^[\+]?[1-9][\d]{0,15}$/;
                        if (!phoneRegex.test(field.value.trim())) {
                            field.classList.add('is-invalid');
                            errorElement.textContent = 'Please enter a valid phone number';
                        } else {
                            field.classList.remove('is-invalid');
                            errorElement.textContent = '';
                        }
                    } else {
                        field.classList.remove('is-invalid');
                        errorElement.textContent = '';
                    }
                    break;
            }
        }
    </script>
</body>
</html>
