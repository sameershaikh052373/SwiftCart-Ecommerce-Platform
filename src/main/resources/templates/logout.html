<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - Swiftcart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
        }

        main {
            flex: 1;
            padding-bottom: 3rem; /* Added padding at bottom of main content */
        }

        .logout-container {
            max-width: 600px;
            margin: 5rem auto 3rem; /* Added more bottom margin */
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .logo-text {
            font-weight: 700;
            color: #6c5ce7;
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }

        .logout-icon {
            font-size: 4rem;
            color: #6c5ce7;
            margin-bottom: 1.5rem;
        }

        h1 {
            color: #2d3436;
            margin-bottom: 1.5rem;
        }

        p {
            color: #636e72;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .btn-primary {
            background-color: #6c5ce7;
            border: none;
            border-radius: 8px;
            padding: 10px 25px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #5649c0;
            transform: translateY(-2px);
        }

        footer {
            background-color: #343a40;
            color: white;
            padding: 30px 0;
            border-radius: 12px 12px 0 0;
            margin-top: auto; /* This ensures footer stays at bottom */
        }

        .social-links a {
            color: white;
            font-size: 1.2rem;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            color: #a29bfe;
            transform: translateY(-3px);
        }

        .copyright {
            color: #b2b2b2;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .logout-container {
                margin: 3rem 1rem 2rem; /* Adjusted margins for mobile */
                padding: 1.5rem;
            }
            
            .logo-text {
                font-size: 2rem;
            }
            
            .logout-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <main> <!-- Added main tag to wrap content -->
        <div class="logout-container">
            <div class="logo-text">Swiftcart</div>
            <div class="logout-icon">
                <i class="fas fa-sign-out-alt"></i>
            </div>
            <h1>You've been successfully logged out</h1>
            <p>Thank you for shopping with us! We hope to see you again soon.</p>
            <p>Come back anytime for great deals and new products!</p>
            
            <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                <a href="/" class="btn btn-primary btn-lg px-4 gap-3">
                    <i class="fas fa-home me-2"></i>Back to Home
                </a>
                <a href="/products-by-category" class="btn btn-outline-primary btn-lg px-4">
                    <i class="fas fa-shopping-bag me-2"></i>Continue Shopping
                </a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="social-links">
                <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
                <a href="https://twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <div class="copyright">
                &copy; <span id="currentYear"></span> Swiftcart. All Rights Reserved.
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
