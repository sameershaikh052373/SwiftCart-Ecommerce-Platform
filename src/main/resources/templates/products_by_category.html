<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Categories - Swiftcart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style th:replace="fragments/styles :: common-styles"></style>
    <style>

        /* Main Content */
        .container {
            flex: 1;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        .page-title {
            color: #6c5ce7;
            margin-bottom: 2rem;
            position: relative;
            padding-bottom: 10px;
            text-align: center;
        }

        .page-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: #6c5ce7;
            border-radius: 3px;
        }

        /* Categories List */
        .categories-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .category-list {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }

        .category-item {
            background-color: #f8f9fa;
            border-radius: 8px;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .category-link {
            display: block;
            padding: 1.5rem;
            color: #2d3436;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
        }

        .category-link:hover {
            color: white;
            background-color: #6c5ce7;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        .category-link::before {
            content: '\f290'; /* Shopping bag icon */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            display: block;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #6c5ce7;
            transition: all 0.3s ease;
        }

        .category-link:hover::before {
            color: white;
        }

        /* Button */
        .btn-primary {
            background-color: #6c5ce7;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            margin-top: 2rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            background-color: #5649c0;
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            background-color: #343a40;
            color: white;
            padding: 30px 0;
            margin-top: 50px;
            border-radius: 12px 12px 0 0;
        }

        .social-links a {
            color: white;
            font-size: 1.2rem;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            color: #a29bfe;
            transform: translateY(-3px);
        }

        .copyright {
            color: #b2b2b2;
            font-size: 0.9rem;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .navbar-collapse {
                background: white;
                border-radius: 0 0 12px 12px;
                padding: 15px;
                margin-top: 10px;
            }
            
            .categories-container {
                padding: 1.5rem;
            }
            
            .category-list {
                grid-template-columns: 1fr;
            }
            
            /* Mobile-specific nav link hover styles */
            .navbar-collapse .nav-link {
                padding: 8px 0;
                margin: 5px 0;
                background-color: transparent !important;
            }
            
            .navbar-collapse .nav-link:hover,
            .navbar-collapse .nav-link.active {
                color: #6c5ce7 !important;
                background-color: transparent !important;
                text-decoration: underline;
                text-underline-offset: 5px;
            }
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav th:replace="fragments/navbar :: user-navbar"></nav>


    <!-- Main Content -->
    <div class="container">
        <h1 class="page-title">Product Categories</h1>
        
        <div class="categories-container">
            <ul class="category-list">
                <li class="category-item" th:each="cat : ${categories}">
                    <a th:href="@{/category/{id}(id=${cat.id})}" class="category-link" th:text="${cat.name}"></a>
                </li>
            </ul>
            
            <div class="text-center">
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-home me-1"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer th:replace="fragments/footer :: footer"></footer>
    <script th:replace="fragments/footer :: footer-script"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
