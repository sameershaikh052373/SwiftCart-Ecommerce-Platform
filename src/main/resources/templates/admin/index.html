<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EShop - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style th:replace="fragments/styles :: common-styles"></style>
    <style>

        /* Main Content */
        .container {
            flex: 1;
            padding-top: 2rem;
        }

        .page-title {
            color: #17a2b8;
            margin-bottom: 2rem;
            position: relative;
            padding-bottom: 10px;
            text-align: center;
        }

        .page-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: #17a2b8;
            border-radius: 3px;
        }

        /* Products Container */
        .products-container {
            background-color: #e9ecef;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }

        /* Product Cards */
        .product-card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            margin-bottom: 25px;
            height: 100%;
            background-color: white;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(23, 162, 184, 0.3);
        }

        .card-img-top {
            height: 200px;
            object-fit: contain;
            border-radius: 12px 12px 0 0 !important;
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-title {
            color: #2d3436;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .card-text {
            color: #636e72;
            margin-bottom: 0.5rem;
        }

        .price {
            color: #17a2b8;
            font-weight: 700;
            font-size: 1.2rem;
        }

        /* Buttons */
        .btn-primary {
            background-color: #17a2b8;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #138496;
            transform: translateY(-2px);
        }

        .btn-warning {
            background-color: #ffc107;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            transition: all 0.3s ease;
        }

        .btn-warning:hover {
            background-color: #e0a800;
            transform: translateY(-2px);
        }

        .btn-danger {
            background-color: #dc3545;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            transition: all 0.3s ease;
        }

        .btn-danger:hover {
            background-color: #c82333;
            transform: translateY(-2px);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background-color: #f8f9fa;
            border-top: 1px solid #eee;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .product-card {
                margin-bottom: 20px;
            }
            
            .products-container {
                padding: 1.5rem;
            }

            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .action-buttons .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

  
  <nav th:replace="fragments/navbar :: admin-navbar"></nav>
    
    

    <!-- Main Content -->
    <div class="container">
        <h2 class="page-title">Admin Dashboard</h2>

        <div class="row mb-4">
            <div class="col">
                <a href="/admin/add" class="btn btn-primary">
                    <i class="fas fa-plus me-2"></i>Add Product
                </a>
            </div>
        </div>

        <!-- Products Container -->
        <div class="products-container">
        <form method="get" th:action="@{/admin/home}" class="mb-4 d-flex justify-content-end">
        <select name="sort" onchange="this.form.submit()" class="form-select w-auto">
            <option value="">Sort by</option>
            <option value="priceHigh" th:selected="${param.sort == 'priceHigh'}">Price: High to Low</option>
            <option value="priceLow" th:selected="${param.sort == 'priceLow'}">Price: Low to High</option>
            <option value="nameAsc" th:selected="${param.sort == 'nameAsc'}">Alphabetical</option>
        </select>
    </form>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <div class="col" th:each="product:${productlist}">
                    <div class="card product-card h-100">
                        <img
                            th:src="${product.image}"
                            class="card-img-top"
                            alt="Image of [[${product.name}]]"
                        />
                        <div class="card-body">
                            <h5 class="card-title" th:text="${product.name}"></h5>
                            <p class="card-text price">₹<span th:text="${product.price}"></span></p>
                            <p class="card-text" th:text="${product.description}"></p>
                        </div>
                        <div class="action-buttons">
                            <a th:href="@{/admin/update/{id}(id=${product.id})}"
                                class="btn btn-warning">
                                <i class="fas fa-edit me-2"></i>Edit
                            </a>
                            <form th:action="@{/admin/delete/{id}(id=${product.id})}"
                                onsubmit="return confirm('Are you sure you want to delete this product?');" 
                                style="display:inline">
                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-trash-alt me-2"></i>Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="fragments/footer :: footer"></footer>
    <script th:replace="fragments/footer :: footer-script"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
