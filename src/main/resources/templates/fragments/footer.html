<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Fragment</title>
</head>
<body>
    <!-- Footer Fragment -->
    <footer th:fragment="footer" class="mt-auto">
        <div class="container text-center">
            <div class="social-links mb-3">
                <a href="https://facebook.com" target="_blank" aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://instagram.com" target="_blank" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://twitter.com" target="_blank" aria-label="X (Twitter)">
                    <i class="fab fa-x-twitter"></i>
                </a>
                <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <a href="https://youtube.com" target="_blank" aria-label="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
            </div>
            <div class="copyright">
                &copy; <span id="currentYear"></span> Swiftcart. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Script to update current year -->
    <script th:fragment="footer-script">
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
</body>
</html>
